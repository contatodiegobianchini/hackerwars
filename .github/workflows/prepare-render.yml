name: Prepare Render deployment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Render runtime and client endpoints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('server/src/secure-server.ts')
          s = p.read_text()
          marker = "export default capturedServer;"
          listen = "const PORT = Number(process.env.PORT || 10000);\n\ncapturedServer.listen(PORT, '0.0.0.0', () => {\n  console.log(`HackerWars server listening on ${PORT}`);\n});\n\n"
          if "capturedServer.listen(PORT" not in s:
              s = s.replace(marker, listen + marker)
              p.write_text(s)

          p = Path('client/src/stores/useGameStore.ts')
          s = p.read_text()

          if 'const HACKERWARS_BACKEND_URL' not in s:
              anchor = "import confetti from 'canvas-confetti';\n"
              insertion = anchor + "\nconst HACKERWARS_BACKEND_URL = (import.meta.env.VITE_API_URL || 'https://hackerwars-api.onrender.com').replace(/\\/$/, '');\nconst HACKERWARS_SOCKET_URL = (import.meta.env.VITE_SOCKET_URL || HACKERWARS_BACKEND_URL).replace(/\\/$/, '');\n"
              s = s.replace(anchor, insertion, 1)

          s = s.replace("fetch('/api/", "fetch(`${HACKERWARS_BACKEND_URL}/api/")
          s = s.replace("const socket = io('/', {", "const socket = io(HACKERWARS_SOCKET_URL, {")

          s = re.sub(r"\n\s*socket\.emit\('set_user_session', \{ userId: (?:user\.id|data\.user\.id) \}\);", "", s)
          s = re.sub(r"\n\s*if \(u\?\.id\) \{\n\s*socket\.emit\('set_user_session', \{ userId: u\.id \}\);\n\s*\}", "", s)
          s = re.sub(r"\n\s*if \(user\?\.id && existing\.connected\) \{\n\s*existing\.emit\('set_user_session', \{ userId: user\.id \}\);\n\s*\}", "", s)

          p.write_text(s)
          PY

      - name: Commit deployment preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/secure-server.ts client/src/stores/useGameStore.ts
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: route frontend to Render backend [skip ci]"
          git push
